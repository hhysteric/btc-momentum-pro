name: Update BTC Momentum Pro Data

on:
  schedule:
    - cron: '5 0 * * *'  # Daily at 00:05 UTC (08:05 Beijing)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 1. BTC OHLCV (JLST depends on this)
      - name: Update BTC historical CSV
        run: python scripts/update_btc_csv.py

      # 2. On-chain (MVRV, realized price, NUPL)
      - name: Update on-chain data
        env:
          CRYPTOQUANT_KEY: ${{ secrets.CRYPTOQUANT_KEY }}
        run: python scripts/update_onchain.py

      # 3. ETF flow
      - name: Update ETF flow
        run: python scripts/update_etf.py

      # 4. BTC/AAPL
      - name: Update BTC/AAPL ratio
        run: python scripts/update_btc_aapl.py

      # 5. Dominance
      - name: Update dominance
        run: python scripts/update_dominance.py

      # 6. URPD
      - name: Update URPD
        env:
          CRYPTOQUANT_KEY: ${{ secrets.CRYPTOQUANT_KEY }}
        run: python scripts/update_urpd.py

      # 7. JLST signals + multi-signal logic (depends on btc_historical.csv)
      - name: Run JLST data pipeline
        run: python scripts/update_jlst.py

      # 8. Email alert on new long/short signal (idempotent via data/last_alert.json)
      #    发信是附加功能，失败不应阻断核心的数据更新/提交流程。
      - name: Notify on new signal
        continue-on-error: true
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/notify_signals.py

      # 9. Commit & push
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: auto-update $(date -u +%Y-%m-%d)"
          git push

      # 10. Guard LAST, after the data has landed. The funding & on-chain fetches
      #     degrade gracefully (a feed outage must not block price/signal updates),
      #     which is how a geo-blocked endpoint went unnoticed for 12 days and a
      #     missing CRYPTOQUANT_KEY froze MVRV/RP/NUPL for ~2 months. Fail the run
      #     here so the red X surfaces it — without withholding the data.
      - name: Verify funding rate feed is fresh
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          meta = json.load(open("data/meta.json"))
          stale, last = meta.get("funding_stale_days"), meta.get("funding_last_ts")
          print(f"funding_last_ts={last}  stale_days={stale}")
          if stale is None:
              sys.exit("funding feed has no usable records at all")
          if stale > 3:
              sys.exit(f"funding feed is {stale:.1f} days stale - check the endpoint")
          PY

      - name: Verify on-chain feed is fresh
        if: always()
        run: |
          python - <<'PY'
          import datetime, sys
          today = datetime.datetime.now(datetime.timezone.utc).date()
          # RP 的兜底源 bitcoin-data.com 本身有 ~6 天发布延迟（前端会用 price/mvrv
          # 反推缺失日，图线不中断），阈值放宽到 10；MVRV/NUPL 无此延迟，5 天。
          LIMITS = {"MVRV": 5, "Realized Price": 10, "NUPL": 5}
          def newest_valid(path):
              with open(path, encoding="utf-8-sig") as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("Datetime"):
                          continue
                      cols = line.split(",")
                      if len(cols) >= 2 and cols[1].strip():
                          return datetime.date.fromisoformat(cols[0][:10])
              return None
          bad = []
          for name, path in [("MVRV", "data/mvrv.csv"),
                             ("Realized Price", "data/realized_price.csv"),
                             ("NUPL", "data/nupl.csv")]:
              last = newest_valid(path)
              if last is None:
                  bad.append(f"{name}: no usable records")
                  continue
              stale = (today - last).days
              print(f"{name}: last={last}  stale_days={stale} (limit {LIMITS[name]})")
              if stale > LIMITS[name]:
                  bad.append(f"{name} feed is {stale} days stale (last {last})")
          if bad:
              sys.exit("; ".join(bad))
          PY
